# netlify.toml — Netlify build + SPA routing.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page-app fallback: every path serves index.html so hash routes
# and hard refreshes work on any URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
